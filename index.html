<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta
      name="description"
      content="Pujo Sahayak — see the Puja, understand the story. Pandal discovery, planning, Maya and Kolkata local exploration."
    />
    <title>Pujo Sahayak — See the Puja. Understand the story.</title>
    <style>
      /* Inline boot splash — paints on frame 1 (before the JS bundle runs) so the
         festive intro covers the real cold start. Every animated element is
         explicitly layer-promoted (`will-change` + `backface-visibility: hidden`
         + a static `translateZ(0)`) so per-frame work happens on the compositor,
         NOT on the main thread (which is saturated parsing the 19 route chunks
         + mounting React behind this splash). Removed by main.tsx once ready. */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #160e0a; color: #faf3e6; overflow: hidden;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-tap-highlight-color: transparent;
        transition: opacity .4s ease, visibility .4s ease;
        will-change: opacity;
      }
      #boot.boot-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot .aura {
        position: absolute; inset: 0;
        background:
          radial-gradient(120% 80% at 50% 118%, rgba(124,58,237,.45), transparent 60%),
          radial-gradient(60% 45% at 50% 14%, rgba(243,197,102,.12), transparent 70%);
      }
      #boot .mark {
        position: relative; width: 84px; height: 84px; border-radius: 22px;
        display: grid; place-items: center; font-size: 40px; line-height: 1;
        background: linear-gradient(135deg, #ff2d95, #8e5cff 52%, #0a84ff);
        box-shadow: 0 10px 32px rgba(139,92,246,.45);
        will-change: transform, opacity; backface-visibility: hidden; transform: translateZ(0);
        animation: b-pop .6s cubic-bezier(.22,1,.36,1) both;
      }
      #boot .title {
        position: relative; margin-top: 18px; opacity: 0;
        font-family: 'Playfair Display', Georgia, serif; font-size: 30px; letter-spacing: .04em;
        will-change: transform, opacity; backface-visibility: hidden; transform: translateZ(0);
        animation: b-rise .6s ease .25s forwards;
      }
      #boot .greet {
        position: relative; margin-top: 8px; opacity: 0; text-align: center;
        font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: rgba(250,243,230,.72);
        will-change: transform, opacity; backface-visibility: hidden; transform: translateZ(0);
        animation: b-rise .6s ease .45s forwards;
      }
      #boot .greet b { color: #f3c566; font-weight: 600; font-size: 17px; letter-spacing: .02em; }
      #boot .diyask { display: flex; gap: 26px; margin-top: 24px; position: relative; }
      #boot .diya { position: relative; width: 34px; height: 32px; }
      #boot .diya .lamp {
        position: absolute; left: 0; bottom: 0; width: 34px; height: 15px;
        border-radius: 0 0 17px 17px / 0 0 15px 15px;
        background: linear-gradient(#b4551f, #7a3717);
        box-shadow: inset 0 2px 3px rgba(255,255,255,.28);
      }
      #boot .diya .fl {
        position: absolute; left: 50%; bottom: 13px; width: 10px; height: 20px; margin-left: -5px;
        transform-origin: bottom center; border-radius: 50% 50% 46% 46% / 64% 64% 36% 36%;
        background: radial-gradient(60% 60% at 50% 72%, #fff6d8, #ffd479 36%, #ff9a2e 68%, rgba(255,90,20,0));
        /* No box-shadow here — a soft outer shadow on a per-frame animating
           gradient-filled element forces re-raster. The outer transparent stop
           on the radial gradient already reads as glow. */
        will-change: transform, opacity; backface-visibility: hidden; transform: translateZ(0);
        animation: b-flick 1.4s ease-in-out infinite;
      }
      #boot .diya:nth-child(2) .fl { animation-delay: .2s; }
      #boot .diya:nth-child(3) .fl { animation-delay: .4s; }
      #boot .hint { position: absolute; bottom: 26px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: rgba(250,243,230,.4); will-change: opacity; animation: b-blink 2.2s ease-in-out infinite; }
      @keyframes b-pop { from { opacity: 0; transform: translate3d(0, 10px, 0) scale(.6); } to { opacity: 1; transform: none; } }
      @keyframes b-rise { from { opacity: 0; transform: translate3d(0, 10px, 0); } to { opacity: 1; transform: none; } }
      /* Opacity + a 1.5 px translateY — both pure-GPU. Deliberately avoids
         `scale` because scaling a radial-gradient background forces the
         compositor to re-rasterize the gradient every frame on some Android
         WebView kernels. A candle's visible flicker is luminance variation
         anyway, so opacity reads as more authentic than scale. */
      @keyframes b-flick { 0%,100% { opacity: 1; transform: translate3d(0, 0, 0); } 50% { opacity: .78; transform: translate3d(0, -1.5px, 0); } }
      @keyframes b-blink { 0%,100% { opacity: .25; } 50% { opacity: .6; } }
      @media (prefers-reduced-motion: reduce) {
        #boot * { animation: none !important; }
        #boot .title, #boot .greet { opacity: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="splash" aria-label="Pujo Sahayak — শুভ শারদীয়া">
      <div class="aura"></div>
      <div class="mark">🪔</div>
      <div class="title">Pujo Sahayak</div>
      <div class="greet"><b>শুভ শারদীয়া</b> · Subho Sharadiya</div>
      <div class="diyask">
        <span class="diya"><span class="fl"></span><span class="lamp"></span></span>
        <span class="diya"><span class="fl"></span><span class="lamp"></span></span>
        <span class="diya"><span class="fl"></span><span class="lamp"></span></span>
      </div>
      <div class="hint">tap to skip</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
